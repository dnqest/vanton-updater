name: Update Vanton Reports

on:
  schedule:
    - cron: '15 1,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas matplotlib quantstats-lumi

      - name: Run main.py
        env:
          PNL_FTP_HOST: ${{ secrets.PNL_FTP_HOST }}
          PNL_FTP_PORT: ${{ secrets.PNL_FTP_PORT }}
          PNL_FTP_USER: ${{ secrets.PNL_FTP_USER }}
          PNL_FTP_PASS: ${{ secrets.PNL_FTP_PASS }}
        run: python main.py

      - name: Upload HTML to hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          for f in prime.html crossmarket.html highrisk.html; do
            if [[ -f "$f" ]]; then
              curl --silent --show-error --insecure \
                   --ftp-method nocwd --ftp-pasv \
                   --connect-timeout 25 --max-time 180 \
                   --retry 6 --retry-delay 15 --retry-connrefused \
                   --fail \
                   -T "$f" "ftp://$FTP_HOST/$FTP_REMOTE_DIR" \
                   --user "$FTP_USER:$FTP_PASS" \
                && echo "✅ Загружен $f" \
                || echo "❌ Ошибка загрузки $f"
            fi
          done
